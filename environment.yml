# Optional single environment with the tool versions used in development/testing.
# The pipeline itself pins the same versions per process in nextflow.config.
name: phage-assembly-nf
channels:
  - conda-forge
  - bioconda
dependencies:
  - nextflow>=24.04
  - porechop_abi=0.5.0
  - filtlong=0.3.1
  - flye=2.9.6
  - medaka=2.1.1
  - dnaapler=1.4.0
  - pharokka=1.10.1
  # Host branch
  - minimap2=2.28
  - samtools=1.20
  - kaptive=3.1.0
  - mlst=2.33.1
  # PhaBOX2 is best installed in its own environment: bioconda::phabox=2.1.13 with conda-forge::pandas=2.2 (PhaBOX 2.1.13 crashes with pandas 3)
